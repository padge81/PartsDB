name: Web application

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/workshop-guide.test.mjs tests/repair-annotations.test.mjs tests/repair-autosave.test.mjs tests/navigation.test.mjs tests/repair-status.test.mjs tests/select-search.test.mjs tests/request-machine-label.test.mjs tests/machine-compatibility.test.mjs tests/repair-view.test.mjs tests/catalogue-search.test.mjs tests/image-compression.test.mjs tests/circumference.test.mjs
      - run: npm run build
