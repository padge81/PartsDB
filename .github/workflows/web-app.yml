name: Web application

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
